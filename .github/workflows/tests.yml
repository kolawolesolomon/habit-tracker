name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --no-web-resources-cdn
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load the web build in Chrome and capture a preview
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tests/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" --no-audit --no-fund playwright@1.58.2
          python3 -m http.server 8765 --directory build/web &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in {1..10}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node <<'JS'
          const { chromium } = require("playwright");
          async function check() {
            const browser = await chromium.launch({ channel: "chrome" });
            try {
              const page = await browser.newPage({ viewport: { width: 420, height: 680 } });
              await page.addInitScript(() => {
                window.addEventListener("flutter-first-frame", () => {
                  document.documentElement.dataset.flutterReady = "true";
                });
              });
              await page.goto("http://127.0.0.1:8765/");
              await page.locator("html[data-flutter-ready=true]").waitFor({ state: "attached" });
              await page.screenshot({ path: "habit-tracker.png" });
            } finally {
              await browser.close();
            }
          }
          check().catch((error) => { console.error(error); process.exitCode = 1; });
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-preview
          path: habit-tracker.png
          if-no-files-found: error
